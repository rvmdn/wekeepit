name: Build & Package WeKeepIt Portable Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-portable:
    name: Build WeKeepIt Portable (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Prepare Assets & Sample Data
        shell: pwsh
        run: |
          if (-not (Test-Path "wekeepit-data.json")) {
            Copy-Item "wekeepit-data.sample.json" "wekeepit-data.json"
          }

      - name: Restore NuGet Packages
        run: dotnet restore desktop-app/WeKeepIt.csproj

      - name: Publish Windows App
        run: |
          dotnet publish desktop-app/WeKeepIt.csproj -c Release -r win-x64 --self-contained false -o ./build-output

      - name: Assemble Portable Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./package/WeKeepIt-v1.1-Portable -Force
          Copy-Item -Path ./build-output/* -Destination ./package/WeKeepIt-v1.1-Portable -Recurse -Force
          
          # Include sample data if not generated
          if (-not (Test-Path "./package/WeKeepIt-v1.1-Portable/wekeepit-data.json")) {
            Copy-Item "wekeepit-data.sample.json" "./package/WeKeepIt-v1.1-Portable/wekeepit-data.json"
          }

          # Compress to portable zip
          Compress-Archive -Path ./package/WeKeepIt-v1.1-Portable -DestinationPath ./WeKeepIt-v1.1-Portable.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeKeepIt-v1.1-Portable
          path: WeKeepIt-v1.1-Portable.zip
          retention-days: 14

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WeKeepIt-v1.1-Portable.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
