# Nginx Reverse Proxy Configuration for WeKeepIt
# Letakkan di /etc/nginx/conf.d/wekeepit.conf

upstream wekeepit_backend {
    server 127.0.0.1:4321;
    keepalive 32;
}

server {
    listen 80;
    server_name wekeepit.perusahaan.local;

    # Redirect HTTP to HTTPS (opsional untuk intranet)
    # return 301 https://$host$request_uri;

    client_max_body_size 50M;

    location / {
        proxy_pass http://wekeepit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for large file indexing & search
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
